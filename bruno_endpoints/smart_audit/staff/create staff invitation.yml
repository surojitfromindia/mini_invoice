info:
  name: create staff invitation
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url_api_v1}}/staff/invitations"
  body:
    type: json
    data: |-
      {
        "inviteeEmail": "staff1@example.com",
        "inviteeFirstName": "Staff",
        "inviteeLastName": "One",
        "rolePublicId": "{{staff_role_public_id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let response_body = res.getBody();
        let invitation_id = response_body?.data?.invitationId;
        let invitation_token = response_body?.data?.invitationToken;
        bru.setEnvVar("staff_invitation_id", invitation_id)
        bru.setEnvVar("staff_invitation_token", invitation_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
