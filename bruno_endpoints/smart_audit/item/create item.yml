info:
  name: create item
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url_api_v1}}/item"
  body:
    type: json
    data: |-
      {
        "sku": "ITEM-001",
        "barcode": "8901234567890",
        "namePrimary": "Milk 1L",
        "nameSecondary": "Full Cream",
        "description": "Seeded sample item",
        "itemType": "product",
        "itemUsage": "both",
        "baseUnitPublicId": "2C68214648E8",
        "purchaseUnitPublicId": null,
        "salesUnitPublicId": "2C68214648E8",
        "defaultPurchasePrice": null,
        "defaultSalesPrice": "52.00",
        "trackInventory": true,
        "allowNegativeStock": false,
        "reorderLevel": "10.00",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let response_body = res.getBody();
        let item_public_id = response_body?.data?.publicId;
        bru.setEnvVar("item_public_id", item_public_id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
