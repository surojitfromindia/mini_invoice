opencollection: 1.0.0

info:
  name: smart_audit
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        req.setHeader(
          "Authorization",
          `Bearer ${bru.getEnvVar("access_token")}`
        );
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
