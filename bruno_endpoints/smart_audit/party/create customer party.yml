runtime:
  scripts:
    - type: after-response
      code: |-
        let response_body = res.getBody();
        let customer_party_public_id = response_body?.data?.publicId;
        bru.setEnvVar("customer_party_public_id", customer_party_public_id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
