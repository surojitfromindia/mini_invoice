info:
  name: create organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url_api_v1}}/organization/basic"
  body:
    type: json
    data: |-
      {
        "namePrimary" : "Organization 1",
        "nameSecondary" : "Organization 1",
        "countryIsoCode" : "IN",
        "currencyIsoCode" : "INR"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let response_body = res.getBody();
        let organization_public_id = response_body?.data?.publicId;
        bru.setEnvVar("organization_public_id", organization_public_id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
