info:
  name: refresh token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url_api_v1}}/auth/refresh_token"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response_body = res.getBody();

        const access_token = response_body?.data?.accessToken;
        if(access_token){
          bru.setEnvVar("access_token", access_token)
        }

        const refresh_token = response_body?.data?.refreshToken
        if(refresh_token){
          bru.setEnvVar("refresh_token", refresh_token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
