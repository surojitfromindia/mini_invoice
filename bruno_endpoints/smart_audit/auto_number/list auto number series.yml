info:
  name: list auto number series
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_api_v1}}/auto_number?page=1&perPage=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: perPage
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
