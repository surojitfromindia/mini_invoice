info:
  name: list branches
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url_api_v1}}/branch?page=1&per_page=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
