info:
  name: get access token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url_api_v1}}/user_account/refresh_token"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let response_body = res.getBody();
        let access_token = response_body?.data?.access_token;
        let refresh_token = response_body?.data?.refresh_token
        bru.setEnvVar("access_token", access_token)
        bru.setEnvVar("refresh_token", refresh_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
